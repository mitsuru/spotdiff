[workspace]
members = ["crates/spotdiff"]
default-members = ["crates/spotdiff"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Terminal image diff viewer using the Kitty Graphics Protocol"
readme = "README.md"
repository = "https://github.com/mitsuru/spotdiff"

[workspace.dependencies]
anyhow = "1.0"
base64-simd = "0.8"
flate2 = "1.0"
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
ratatui-image = { version = "=11.1.0", default-features = false, features = ["crossterm"] }

tempfile = "3.27"
