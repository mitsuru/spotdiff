# Merge these entries into customCommands in your lazygit config.yml.
# Quit spotdiff with q, then press Enter at lazygit's return prompt.
customCommands:
  - key: 'I'
    context: 'files'
    description: 'Compare image changes'
    command: 'spotdiff git {{if not .SelectedFile.HasUnstagedChanges}}--staged {{end}}-- {{.SelectedFile.Name | quote}}'
    output: terminal
  - key: '<c-s>'
    context: 'files'
    description: 'Compare staged image changes'
    command: 'spotdiff git --staged -- {{.SelectedFile.Name | quote}}'
    output: terminal
